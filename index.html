<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flybot 3D Isométrique</title>
    <style>
      body { margin:0; background:linear-gradient(#f8d7ff,#bfefff 42%,#dff8d4); font-family:system-ui,sans-serif; overflow:hidden; }
      #root { width:100vw; height:100vh; }
      .ui { position:fixed; top:8px; left:8px; background:#ffffffcc; padding:8px 12px; border-radius:10px; font-weight:700; z-index:10; }
      canvas { display:block; width:100vw; height:100vh; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;

      function FlybotGame() {
        const canvasRef = useRef(null);
        const [score, setScore] = useState(0);
        const [bonus, setBonus] = useState('Aucun');

        useEffect(() => {
          const c = canvasRef.current;
          const ctx = c.getContext('2d');
          let raf;
          const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
          c.width = 960 * dpr; c.height = 540 * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);

          const state = {
            t:0, score:0, gameOver:false,
            butterfly:{x:200,y:270,vy:0,shield:false,agility:1},
            wind:0, obstacles:[], bonuses:[], touchY:270, megaFlower:null, nextFlowerScore:100
          };
          const rand=(a,b)=>Math.random()*(b-a)+a;
          const iso=(x,y,z=0)=>({x:(x-y)*1.15+480,y:(x+y)*0.58-z+52});

          for(let i=0;i<3;i++) state.obstacles.push({x:rand(980,1480),y:rand(150,410),speed:rand(0.65,1.25)});
          for(let i=0;i<6;i++) state.bonuses.push({x:rand(900,1420),y:rand(100,430),type:['Fleur','Soleil','Abeille'][(Math.random()*3)|0]});

          const setY = (clientY) => {
            const r=c.getBoundingClientRect();
            state.touchY=(clientY-r.top)*(c.height/r.height);
          };
          const mm=e=>setY(e.clientY);
          const ts=e=>setY(e.touches[0].clientY);
          window.addEventListener('mousemove',mm);
          window.addEventListener('touchstart',ts,{passive:true});
          window.addEventListener('touchmove',ts,{passive:true});

          const px=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
          const edge=(x,y,w,h,col='#1f1f1f')=>{ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(Math.round(x)+0.5,Math.round(y)+0.5,w,h)};

          const drawDiamond=(x,y,w,h,col)=>{
            ctx.fillStyle=col; ctx.beginPath();
            ctx.moveTo(x,y);ctx.lineTo(x+w,y+h*0.5);ctx.lineTo(x,y+h);ctx.lineTo(x-w,y+h*0.5);
            ctx.closePath();ctx.fill();
          };


          const drawSkyGarden = () => {
            const sky = ctx.createLinearGradient(0,0,0,540);
            sky.addColorStop(0,'#ffd6f4');
            sky.addColorStop(0.42,'#bdeeff');
            sky.addColorStop(1,'#e9ffd9');
            ctx.fillStyle=sky;
            ctx.fillRect(0,0,960,540);

            const sunPulse = 1 + Math.sin(state.t*0.015)*0.04;
            const sunGlow = ctx.createRadialGradient(760,78,18,760,78,96*sunPulse);
            sunGlow.addColorStop(0,'rgba(255,245,178,0.95)');
            sunGlow.addColorStop(0.55,'rgba(255,213,135,0.25)');
            sunGlow.addColorStop(1,'rgba(255,213,135,0)');
            ctx.fillStyle=sunGlow;
            ctx.fillRect(650,0,220,190);

            const cloud = (x,y,s=1)=>{
              ctx.fillStyle='rgba(255,255,255,0.78)';
              ctx.beginPath();
              ctx.ellipse(x,y,32*s,14*s,0,0,Math.PI*2);
              ctx.ellipse(x+26*s,y+2*s,34*s,12*s,0,0,Math.PI*2);
              ctx.ellipse(x-24*s,y+5*s,24*s,10*s,0,0,Math.PI*2);
              ctx.fill();
            };
            cloud(155 + Math.sin(state.t*0.006)*8,78,1.1);
            cloud(515 + Math.sin(state.t*0.004+2)*10,112,0.9);
            cloud(815 + Math.sin(state.t*0.005+4)*7,138,0.75);
          };


          const drawMountains = () => {
            // montagnes ancrées au plan isométrique (même logique de projection)
            const ridgeIso = (gx, gy, h, w, cTop, cShadow) => {
              const p = iso(gx*44 + (state.t*0.16)%44, gy*44, 0);
              ctx.fillStyle=cTop; ctx.beginPath();
              ctx.moveTo(p.x-w, p.y+8); ctx.lineTo(p.x, p.y-h); ctx.lineTo(p.x+w, p.y+8); ctx.closePath(); ctx.fill();
              ctx.fillStyle=cShadow; ctx.beginPath();
              ctx.moveTo(p.x, p.y-h); ctx.lineTo(p.x+w, p.y+8); ctx.lineTo(p.x+w*0.52, p.y-6); ctx.closePath(); ctx.fill();
            };

            ridgeIso(2.0,-1.8,120,90,'#7fbe8e','#5b8f6b');
            ridgeIso(5.5,-2.2,150,110,'#74b484','#4f815f');
            ridgeIso(8.8,-2.4,180,120,'#86c796','#5d956f');
            ridgeIso(12.2,-2.0,145,100,'#78b988','#548765');
            ridgeIso(15.4,-1.7,118,84,'#8aca98','#629a72');

            // neiges claires moins grises
            ctx.fillStyle='#ffffff';
            const s1=iso(8.8*44 + (state.t*0.16)%44,-2.4*44,0);
            ctx.beginPath(); ctx.moveTo(s1.x,s1.y-180); ctx.lineTo(s1.x+40,s1.y-110); ctx.lineTo(s1.x-40,s1.y-110); ctx.closePath(); ctx.fill();
            const s2=iso(5.5*44 + (state.t*0.16)%44,-2.2*44,0);
            ctx.beginPath(); ctx.moveTo(s2.x,s2.y-150); ctx.lineTo(s2.x+32,s2.y-96); ctx.lineTo(s2.x-32,s2.y-96); ctx.closePath(); ctx.fill();

            ctx.strokeStyle='#e8fff2'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(s1.x,s1.y-180); ctx.lineTo(s1.x+22,s1.y-138); ctx.moveTo(s1.x,s1.y-180); ctx.lineTo(s1.x-18,s1.y-142); ctx.stroke();

            const mist = ctx.createLinearGradient(0,130,0,245);
            mist.addColorStop(0,'rgba(235,255,240,0.28)');
            mist.addColorStop(1,'rgba(235,255,240,0.0)');
            ctx.fillStyle = mist;
            ctx.fillRect(0,120,960,130);
          };

          const drawSpringFlowers = () => {
            // fleurs attachées au plan isométrique (pas écran)
            for(let i=0;i<18;i++){
              const gx = -1 + i*1.2;
              const gy = 10.7 + Math.sin(i*0.6)*0.25;
            // Grand plateau alpin uni, doux et non quadrillé
            drawDiamond(center.x, center.y-20, 640, 318, '#8fdf78');

            // ombres de relief très douces
            ctx.fillStyle='#72c763';
            ctx.moveTo(center.x-640,center.y+139); ctx.lineTo(center.x,center.y+298); ctx.lineTo(center.x,center.y+346); ctx.lineTo(center.x-640,center.y+187);
            ctx.fillStyle='#7fd36d';
            ctx.moveTo(center.x+640,center.y+139); ctx.lineTo(center.x,center.y+298); ctx.lineTo(center.x,center.y+346); ctx.lineTo(center.x+640,center.y+187);
            // lac calme en forme isométrique avec reflet
            drawDiamond(center.x+210, center.y+62, 118, 46, '#78d8ef');
            drawDiamond(center.x+210, center.y+70, 92, 30, '#a8efff');
            ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(center.x+162,center.y+83); ctx.lineTo(center.x+238,center.y+104); ctx.stroke();

            // sentier sinueux relaxant, sans carrelage
            ctx.fillStyle='#dcc996';
            ctx.ellipse(center.x-150, center.y+52, 135, 34, -0.35, 0, Math.PI*2);
            ctx.ellipse(center.x+18, center.y+83, 150, 38, -0.28, 0, Math.PI*2);

            // taches florales pastel ancrées au sol
            const patch = (dx,dy,col)=>{
              for(let i=0;i<8;i++){
                const x=center.x+dx+i*12;
                const y=center.y+dy+Math.sin(i*1.7)*7;
                drawDiamond(x,y,5,4,col);
              }
            };
            patch(-315,72,'#ff8bd8');
            patch(-45,34,'#f8f0a1');
            patch(250,118,'#c8a0ff');
              const p = iso(gx*44 + (state.t*0.16)%44, gy*44, 0);
              const trunkH = 18 + (i%3)*3;
              // tronc accroché au sol isométrique
              px(p.x-2, p.y-trunkH+10, 5, trunkH, '#7d4b2f');
              // feuillage géométrique aligné perspective
              drawDiamond(p.x, p.y-trunkH-6, 13, 11, '#55c76a');
              drawDiamond(p.x, p.y-trunkH+1, 10, 8, '#6fd680');
              drawDiamond(p.x, p.y-trunkH+7, 8, 6, '#8be39a');
            }
          };

          const drawGround = () => {
            for(let gx=-2;gx<20;gx++) for(let gy=-1;gy<13;gy++){
              const wx = gx*44 + (state.t*0.16)%44;
              const wy = gy*44;
              const p=iso(wx, wy, 0);

              // terrain organique (prairie, sentier, eau) au lieu damier
              const noise = Math.sin((gx*0.8)+(gy*0.45)) + Math.cos((gy*0.9)-(gx*0.35));
              const pathBand = Math.abs((gy - 5) + Math.sin(gx*0.55)*1.1);
              const pond = Math.hypot(gx-11.5, gy-2.8);

              let top = '#86d974';
              let left = '#6ac05a';
              let right = '#73c964';

              if (pathBand < 0.9) { top='#d7c48c'; left='#bea873'; right='#c9b37e'; }
              else if (pond < 1.6) { top='#7cc9e8'; left='#5ba9c9'; right='#6ab8d8'; }
              else if (noise > 1.0) { top='#79cf63'; left='#61b54f'; right='#6cc05a'; }
              else if (noise < -0.8) { top='#92e07e'; left='#78c866'; right='#83d271'; }

              drawDiamond(p.x,p.y,26,24,top);

              // relief face gauche/droite
              ctx.fillStyle=left;
              ctx.beginPath();
              ctx.moveTo(p.x-26,p.y+12);ctx.lineTo(p.x,p.y+24);ctx.lineTo(p.x,p.y+30);ctx.lineTo(p.x-26,p.y+18);
              ctx.closePath();ctx.fill();

              ctx.fillStyle=right;
              ctx.beginPath();
              ctx.moveTo(p.x+26,p.y+12);ctx.lineTo(p.x,p.y+24);ctx.lineTo(p.x,p.y+30);ctx.lineTo(p.x+26,p.y+18);
              ctx.closePath();ctx.fill();

              // petites fleurs ponctuelles sur prairie
              if (top === '#86d974' && (gx+gy)%5===0) {
                px(p.x-2,p.y+9,4,3,'#ff7bcf');
              }
            }
          };

          const drawButterfly=(b)=>{
            const p=iso(b.x*0.6,b.y*0.6,62);

            // Papillon type monarque (orange/noir + points blancs)
            drawDiamond(p.x,p.y-4,6,16,'#1f1f1f'); // corps
            drawDiamond(p.x+4,p.y-2,4,10,'#2b2b2b');

            // ailes hautes (orange bord noir)
            drawDiamond(p.x-16,p.y-10,16,14,'#f39c12');
            drawDiamond(p.x+16,p.y-10,16,14,'#f39c12');
            drawDiamond(p.x-16,p.y-10,18,15,'#1a1a1a');
            drawDiamond(p.x+16,p.y-10,18,15,'#1a1a1a');
            drawDiamond(p.x-16,p.y-10,14,12,'#f39c12');
            drawDiamond(p.x+16,p.y-10,14,12,'#f39c12');

            // ailes basses
            drawDiamond(p.x-13,p.y+3,13,11,'#f5b041');
            drawDiamond(p.x+13,p.y+3,13,11,'#f5b041');
            drawDiamond(p.x-13,p.y+3,14,12,'#1a1a1a');
            drawDiamond(p.x+13,p.y+3,14,12,'#1a1a1a');

          const drawMegaFlower=(f)=>{
            if(!f) return;
            const p=iso(f.x*0.6,f.y*0.6,58);
            // grosse fleur spéciale des 100 points
            px(p.x-3,p.y+2,6,14,'#4caf50');
            drawDiamond(p.x,p.y-8,14,10,'#ff4da6');
            drawDiamond(p.x-8,p.y-4,8,6,'#ffd166');
            drawDiamond(p.x+8,p.y-4,8,6,'#ffd166');
          };

              
              const scoreNow = Math.floor(state.score/12);
              if(!state.megaFlower && scoreNow >= state.nextFlowerScore){
                state.megaFlower = { x: rand(930,1250), y: rand(170,380) };
                state.nextFlowerScore += 100;
              }
              if(state.megaFlower){
                state.megaFlower.x -= 0.7; // butinage calme
                if(Math.abs(state.megaFlower.x-b.x)<34 && Math.abs(state.megaFlower.y-b.y)<38){
                  state.score += 10000; // +10k
                  setBonus('Fleur +10k');
              state.wind=Math.sin(state.t*0.006)*0.024;
              b.vy += ((state.touchY-b.y)*0.006*b.agility)+state.wind;
              const speedMul=slowTimer>0?0.45:0.7;
                bo.x -= 0.8;
              }


            drawSkyGarden();
            drawMegaFlower(state.megaFlower);
          <div className="ui">Mode Zen • Score: {score} | Bonus: {bonus}</div>
            drawDiamond(p.x+13,p.y+3,10,8,'#f5b041');

            // nervures stylisées
            ctx.strokeStyle='#3a2a10'; ctx.lineWidth=1.2;
            ctx.beginPath();
            ctx.moveTo(p.x-16,p.y-10); ctx.lineTo(p.x-6,p.y-2);
            ctx.moveTo(p.x+16,p.y-10); ctx.lineTo(p.x+6,p.y-2);
            ctx.moveTo(p.x-13,p.y+3); ctx.lineTo(p.x-5,p.y+7);
            ctx.moveTo(p.x+13,p.y+3); ctx.lineTo(p.x+5,p.y+7);
            ctx.stroke();

            // points blancs sur contour des ailes
            const spots = [[-24,-11],[-22,-4],[-19,3],[24,-11],[22,-4],[19,3]];
            ctx.fillStyle='#fff';
            for(const [sx,sy] of spots){ ctx.beginPath(); ctx.arc(p.x+sx,p.y+sy,1.5,0,Math.PI*2); ctx.fill(); }

            // tête + antennes
            ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(p.x+1,p.y-8,3,0,Math.PI*2); ctx.fill();
            ctx.strokeStyle='#111'; ctx.lineWidth=1.2;
            ctx.beginPath(); ctx.moveTo(p.x-1,p.y-10); ctx.lineTo(p.x-4,p.y-15); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(p.x+3,p.y-10); ctx.lineTo(p.x+6,p.y-15); ctx.stroke();

            if(b.shield){ctx.strokeStyle='#00d1ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,24,0,Math.PI*2);ctx.stroke();}
          };

          const drawObstacle=(o)=>{
            const p=iso(o.x*0.6,o.y*0.6,58);
            px(p.x-12,p.y-42,24,44,'#7d4b2f'); edge(p.x-12,p.y-42,24,44);
            drawDiamond(p.x,p.y-54,22,16,'#55c76a');
            drawDiamond(p.x,p.y-46,18,14,'#6fd680');
          };

          const drawBonus=(b)=>{
            const p=iso(b.x*0.6,b.y*0.6,52);
            if(b.type==='Fleur'){px(p.x-4,p.y,8,10,'#4caf50');px(p.x-10,p.y-8,20,8,'#ff4da6');}
            if(b.type==='Soleil'){px(p.x-8,p.y-8,16,16,'#ffd54f');}
            if(b.type==='Abeille'){px(p.x-10,p.y-5,20,10,'#ffd166');px(p.x-4,p.y-5,8,10,'#222');}
          };

          let slowTimer=0, shieldTimer=0, agileTimer=0;
          const applyBonus=(type)=>{
            setBonus(type);
            if(type==='Fleur'){agileTimer=280; state.butterfly.agility=1.7;}
            if(type==='Soleil'){slowTimer=280;}
            if(type==='Abeille'){shieldTimer=280; state.butterfly.shield=true;}
          };

          const loop=()=>{
            if(!state.gameOver){
              state.t++;
              state.wind=Math.sin(state.t*0.008)*0.035;
              const b=state.butterfly;
              b.vy += ((state.touchY-b.y)*0.008*b.agility)+state.wind;
              b.vy *= 0.94;
              b.y = Math.max(70,Math.min(470,b.y+b.vy));

              if(slowTimer>0) slowTimer--; else if(bonus==='Soleil') setBonus('Aucun');
              if(agileTimer>0) agileTimer--; else b.agility=1;
              if(shieldTimer>0) shieldTimer--; else b.shield=false;

              const speedMul=slowTimer>0?0.5:0.85;
              for(const o of state.obstacles){
                o.x -= o.speed*speedMul;
                if(o.x<-90){o.x=rand(980,1360);o.y=rand(120,430);}
                if(Math.abs(o.x-b.x)<38 && Math.abs(o.y-b.y)<44){if(b.shield){b.shield=false;shieldTimer=0;o.x=-120;} else state.gameOver=true;}
              }
              for(const bo of state.bonuses){
                bo.x -= 1.2;
                if(bo.x<-80){bo.x=rand(980,1360);bo.y=rand(110,440);bo.type=['Fleur','Soleil','Abeille'][(Math.random()*3)|0];}
                if(Math.abs(bo.x-b.x)<28 && Math.abs(bo.y-b.y)<34){applyBonus(bo.type);bo.x=-80;}
              }
              state.score++; setScore(Math.floor(state.score/12));
            }

            ctx.clearRect(0,0,960,540);
            drawGround();
            drawMountains();
            drawForestEdge('left');
            drawForestEdge('right');
            [...state.obstacles].sort((a,b)=>a.y-b.y).forEach(drawObstacle);
            state.bonuses.forEach(drawBonus);
            drawButterfly(state.butterfly);
            drawSpringFlowers();
            if(state.gameOver){ctx.fillStyle='#000a';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.fillText('Game Over',370,250);}
            raf=requestAnimationFrame(loop);
          };
          loop();

          return ()=>{cancelAnimationFrame(raf);window.removeEventListener('mousemove',mm);window.removeEventListener('touchstart',ts);window.removeEventListener('touchmove',ts);};
        }, []);

        return <>
          <div className="ui">Mode Cool • Score: {score} | Bonus: {bonus}</div>
          <canvas ref={canvasRef} width="960" height="540" />
        </>;
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<FlybotGame />);
    </script>
  </body>
</html>
