<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flybot 2D Vertical Mobile</title>
    <style>
      body { margin:0; background:linear-gradient(#8ddcff,#c8f3ff); font-family:system-ui,sans-serif; overflow:hidden; }
      #root { width:100vw; height:100vh; }
      .ui { position:fixed; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; background:#ffffffcc; padding:8px 12px; border-radius:10px; font-weight:700; z-index:10; }
      canvas { display:block; width:100vw; height:100vh; image-rendering: pixelated; touch-action:none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;

      function FlybotGame() {
        const canvasRef = useRef(null);
        const [score, setScore] = useState(0);
        const [bonus, setBonus] = useState('Aucun');

        useEffect(() => {
          const c = canvasRef.current;
          const ctx = c.getContext('2d');
          let raf;
          const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
          const W = 420, H = 820;
          c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);

          const state = {
            t:0, score:0, gameOver:false,
            butterfly:{x:210,y:680,vx:0,shield:false,agility:1},
            targetX:210, wind:0,
            obstacles:[], bonuses:[]
          };
          const rand=(a,b)=>Math.random()*(b-a)+a;
          const types=['Fleur','Soleil','Abeille'];
          for(let i=0;i<8;i++) state.obstacles.push({x:rand(50,370),y:rand(-1800,-120),r:16,s:2+Math.random()*1.2});
          for(let i=0;i<4;i++) state.bonuses.push({x:rand(40,380),y:rand(-1600,-80),type:types[(Math.random()*3)|0]});

          const setPointer=(clientX)=>{
            const r=c.getBoundingClientRect();
            state.targetX=(clientX-r.left)*(W/r.width);
          };
          const mm=e=>setPointer(e.clientX);
          const tm=e=>setPointer(e.touches[0].clientX);
          window.addEventListener('mousemove',mm);
          window.addEventListener('touchstart',tm,{passive:true});
          window.addEventListener('touchmove',tm,{passive:true});

          let slowTimer=0, shieldTimer=0, agileTimer=0;
          const applyBonus=(type)=>{
            setBonus(type);
            if(type==='Fleur'){agileTimer=260; state.butterfly.agility=1.6;}
            if(type==='Soleil'){slowTimer=260;}
            if(type==='Abeille'){shieldTimer=260; state.butterfly.shield=true;}
          };

          const drawButterfly=(b)=>{
            ctx.fillStyle='#2f2f2f'; ctx.fillRect(b.x-3,b.y-12,6,24);
            ctx.fillStyle='#ff5eb8'; ctx.fillRect(b.x-22,b.y-10,16,14); ctx.fillRect(b.x+6,b.y-10,16,14);
            ctx.fillStyle='#ffd166'; ctx.fillRect(b.x-18,b.y+4,12,10); ctx.fillRect(b.x+6,b.y+4,12,10);
            ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x+1,b.y-6,3,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(b.x+2,b.y-6,1.2,0,Math.PI*2); ctx.fill();
            if(b.shield){ctx.strokeStyle='#00d1ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,28,0,Math.PI*2);ctx.stroke();}
          };

          const draw = () => {
            ctx.clearRect(0,0,W,H);
            // fond vertical
            for(let i=0;i<22;i++){
              const y=((state.t*1.1+i*40)%900)-40;
              ctx.fillStyle=i%2?'#baf0ff':'#d7f8ff';
              ctx.fillRect(0,H-y, W, 22);
            }
            // obstacles
            for(const o of state.obstacles){
              ctx.fillStyle='#7d4b2f'; ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2); ctx.fill();
              ctx.fillStyle='#58c56a'; ctx.fillRect(o.x-12,o.y-o.r-8,24,8);
            }
            // bonus
            for(const b of state.bonuses){
              if(b.type==='Fleur'){ctx.fillStyle='#ff4da6';ctx.fillRect(b.x-8,b.y-8,16,8);ctx.fillStyle='#4caf50';ctx.fillRect(b.x-2,b.y,4,10);}
              if(b.type==='Soleil'){ctx.fillStyle='#ffd54f';ctx.beginPath();ctx.arc(b.x,b.y,8,0,Math.PI*2);ctx.fill();}
              if(b.type==='Abeille'){ctx.fillStyle='#ffd166';ctx.fillRect(b.x-9,b.y-5,18,10);ctx.fillStyle='#222';ctx.fillRect(b.x-2,b.y-5,4,10);}
            }
            drawButterfly(state.butterfly);
            if(state.gameOver){ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 36px sans-serif';ctx.fillText('Game Over',130,390);}
          };

          const loop=()=>{
            if(!state.gameOver){
              state.t++;
              const b=state.butterfly;
              state.wind=Math.sin(state.t*0.01)*0.25;
              b.vx += ((state.targetX-b.x)*0.008*b.agility)+state.wind*0.03;
              b.vx *= 0.92;
              b.x += b.vx;
              b.x=Math.max(28,Math.min(W-28,b.x));

              if(slowTimer>0) slowTimer--; else if(bonus==='Soleil') setBonus('Aucun');
              if(agileTimer>0) agileTimer--; else b.agility=1;
              if(shieldTimer>0) shieldTimer--; else b.shield=false;

              const speedMul=slowTimer>0?0.6:1;
              for(const o of state.obstacles){
                o.y += o.s*speedMul;
                if(o.y>H+50){o.y=rand(-400,-80);o.x=rand(40,W-40);}
                if(Math.abs(o.x-b.x)<o.r+14 && Math.abs(o.y-b.y)<o.r+14){
                  if(b.shield){b.shield=false;shieldTimer=0;o.y=H+60;} else state.gameOver=true;
                }
              }
              for(const bo of state.bonuses){
                bo.y += 1.6;
                if(bo.y>H+40){bo.y=rand(-420,-90);bo.x=rand(40,W-40);bo.type=types[(Math.random()*3)|0];}
                if(Math.abs(bo.x-b.x)<22 && Math.abs(bo.y-b.y)<20){applyBonus(bo.type);bo.y=H+60;}
              }

              state.score++; setScore(Math.floor(state.score/12));
            }
            draw();
            raf=requestAnimationFrame(loop);
          };
          loop();

          return ()=>{
            cancelAnimationFrame(raf);
            window.removeEventListener('mousemove',mm);
            window.removeEventListener('touchstart',tm);
            window.removeEventListener('touchmove',tm);
          };
        }, []);

        return <>
          <div className="ui"><span>Score: {score}</span><span>Bonus: {bonus}</span></div>
          <canvas ref={canvasRef} />
        </>;
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<FlybotGame />);
    </script>
  </body>
</html>
