<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Flybot 3D Isométrique</title>
    <style>
      body { margin:0; background:linear-gradient(#9fe4ff,#d9f7ff); font-family:system-ui,sans-serif; overflow:hidden; }
      #root { width:100vw; height:100vh; }
      .ui { position:fixed; top:8px; left:8px; background:#ffffffcc; padding:8px 12px; border-radius:10px; font-weight:700; z-index:10; }
      canvas { display:block; width:100vw; height:100vh; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useEffect, useRef, useState } = React;

      function FlybotGame() {
        const canvasRef = useRef(null);
        const [score, setScore] = useState(0);
        const [bonus, setBonus] = useState('Aucun');

        useEffect(() => {
          const c = canvasRef.current;
          const ctx = c.getContext('2d');
          let raf;
          const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
          c.width = 960 * dpr; c.height = 540 * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);

          const state = {
            t:0, score:0, gameOver:false,
            butterfly:{x:200,y:270,vy:0,shield:false,agility:1},
            wind:0, obstacles:[], bonuses:[], touchY:270
          };
          const rand=(a,b)=>Math.random()*(b-a)+a;
          const iso=(x,y,z=0)=>({x:(x-y)*1.15+480,y:(x+y)*0.58-z+52});

          for(let i=0;i<4;i++) state.obstacles.push({x:rand(900,1380),y:rand(130,420),speed:rand(0.9,1.7)});
          for(let i=0;i<5;i++) state.bonuses.push({x:rand(880,1360),y:rand(100,430),type:['Fleur','Soleil','Abeille'][(Math.random()*3)|0]});

          const setY = (clientY) => {
            const r=c.getBoundingClientRect();
            state.touchY=(clientY-r.top)*(c.height/r.height);
          };
          const mm=e=>setY(e.clientY);
          const ts=e=>setY(e.touches[0].clientY);
          window.addEventListener('mousemove',mm);
          window.addEventListener('touchstart',ts,{passive:true});
          window.addEventListener('touchmove',ts,{passive:true});

          const px=(x,y,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)};
          const edge=(x,y,w,h,col='#1f1f1f')=>{ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(Math.round(x)+0.5,Math.round(y)+0.5,w,h)};

          const drawDiamond=(x,y,w,h,col)=>{
            ctx.fillStyle=col; ctx.beginPath();
            ctx.moveTo(x,y);ctx.lineTo(x+w,y+h*0.5);ctx.lineTo(x,y+h);ctx.lineTo(x-w,y+h*0.5);
            ctx.closePath();ctx.fill();
          };


          const drawMountains = () => {
            const ridge = (x, y, w, h, c) => { ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w*0.5,y-h); ctx.lineTo(x+w,y); ctx.closePath(); ctx.fill(); };
            ridge(40,190,220,120,'#7ea48b');
            ridge(180,210,280,150,'#6f977e');
            ridge(380,190,260,135,'#86ae94');
            ridge(620,215,260,140,'#769f84');
            ridge(760,200,210,120,'#83ab90');
            ctx.fillStyle='#f2fff7';
            ctx.beginPath(); ctx.moveTo(300,70); ctx.lineTo(340,120); ctx.lineTo(260,120); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(500,62); ctx.lineTo(548,128); ctx.lineTo(452,128); ctx.closePath(); ctx.fill();
          };

          const drawSpringFlowers = () => {
            for(let i=0;i<26;i++){
              const x = (i*39 + (state.t*0.45)%40);
              const yTop = 450 + Math.sin((i+state.t*0.03))*8;
              px(x, yTop, 2, 10, '#4caf50');
              const petal = i%3===0 ? '#ff6ec7' : (i%3===1 ? '#ffd166' : '#9b7bff');
              px(x-3, yTop-4, 8, 4, petal);
            }
          };

          const drawForestEdge=(side)=>{
            for(let i=0;i<10;i++){
              const baseX = side==='left'? -120 : 1080;
              const depth = i*70 + (state.t*0.25)%70;
              const x = side==='left'? baseX+depth*0.22 : baseX-depth*0.22;
              const y = 120 + i*42;
              // tronc
              px(x, y+8, 10, 20, '#7d4b2f');
              // feuillage géométrique (3 couches)
              drawDiamond(x+5,y-10,20,18,'#55c76a');
              drawDiamond(x+5,y-2,16,14,'#6fd680');
              drawDiamond(x+5,y+6,12,10,'#8be39a');
            }
          };

          const drawGround = () => {
            for(let gx=0;gx<16;gx++) for(let gy=0;gy<11;gy++){
              const wx = gx*44 + (state.t*0.16)%44;
              const wy = gy*44;
              const p=iso(wx, wy, 0);

              // terrain organique (prairie, sentier, eau) au lieu damier
              const noise = Math.sin((gx*0.8)+(gy*0.45)) + Math.cos((gy*0.9)-(gx*0.35));
              const pathBand = Math.abs((gy - 5) + Math.sin(gx*0.55)*1.1);
              const pond = Math.hypot(gx-11.5, gy-2.8);

              let top = '#86d974';
              let left = '#6ac05a';
              let right = '#73c964';

              if (pathBand < 0.9) { top='#d7c48c'; left='#bea873'; right='#c9b37e'; }
              else if (pond < 1.6) { top='#7cc9e8'; left='#5ba9c9'; right='#6ab8d8'; }
              else if (noise > 1.0) { top='#79cf63'; left='#61b54f'; right='#6cc05a'; }
              else if (noise < -0.8) { top='#92e07e'; left='#78c866'; right='#83d271'; }

              drawDiamond(p.x,p.y,26,24,top);

              // relief face gauche/droite
              ctx.fillStyle=left;
              ctx.beginPath();
              ctx.moveTo(p.x-26,p.y+12);ctx.lineTo(p.x,p.y+24);ctx.lineTo(p.x,p.y+30);ctx.lineTo(p.x-26,p.y+18);
              ctx.closePath();ctx.fill();

              ctx.fillStyle=right;
              ctx.beginPath();
              ctx.moveTo(p.x+26,p.y+12);ctx.lineTo(p.x,p.y+24);ctx.lineTo(p.x,p.y+30);ctx.lineTo(p.x+26,p.y+18);
              ctx.closePath();ctx.fill();

              // petites fleurs ponctuelles sur prairie
              if (top === '#86d974' && (gx+gy)%5===0) {
                px(p.x-2,p.y+9,4,3,'#ff7bcf');
              }
            }
          };

          const drawButterfly=(b)=>{
            const p=iso(b.x*0.6,b.y*0.6,62);
            px(p.x-8,p.y-11,14,18,'#2f2f2f'); edge(p.x-8,p.y-11,14,18);
            px(p.x+6,p.y-9,10,14,'#3a3a3a'); edge(p.x+6,p.y-9,10,14);
            px(p.x-30,p.y-14,20,14,'#ff5eb8'); edge(p.x-30,p.y-14,20,14);
            px(p.x-26,p.y+2,18,13,'#ffd166'); edge(p.x-26,p.y+2,18,13);
            px(p.x-4,p.y-15,14,13,'#ff88d0'); edge(p.x-4,p.y-15,14,13);
            px(p.x-2,p.y+3,12,11,'#ffe08a'); edge(p.x-2,p.y+3,12,11);
            ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x+12,p.y-2,3,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(p.x+13,p.y-2,1.2,0,Math.PI*2); ctx.fill();
            if(b.shield){ctx.strokeStyle='#00d1ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,28,0,Math.PI*2);ctx.stroke();}
          };

          const drawObstacle=(o)=>{
            const p=iso(o.x*0.6,o.y*0.6,58);
            px(p.x-12,p.y-42,24,44,'#7d4b2f'); edge(p.x-12,p.y-42,24,44);
            drawDiamond(p.x,p.y-54,22,16,'#55c76a');
            drawDiamond(p.x,p.y-46,18,14,'#6fd680');
          };

          const drawBonus=(b)=>{
            const p=iso(b.x*0.6,b.y*0.6,52);
            if(b.type==='Fleur'){px(p.x-4,p.y,8,10,'#4caf50');px(p.x-10,p.y-8,20,8,'#ff4da6');}
            if(b.type==='Soleil'){px(p.x-8,p.y-8,16,16,'#ffd54f');}
            if(b.type==='Abeille'){px(p.x-10,p.y-5,20,10,'#ffd166');px(p.x-4,p.y-5,8,10,'#222');}
          };

          let slowTimer=0, shieldTimer=0, agileTimer=0;
          const applyBonus=(type)=>{
            setBonus(type);
            if(type==='Fleur'){agileTimer=280; state.butterfly.agility=1.7;}
            if(type==='Soleil'){slowTimer=280;}
            if(type==='Abeille'){shieldTimer=280; state.butterfly.shield=true;}
          };

          const loop=()=>{
            if(!state.gameOver){
              state.t++;
              state.wind=Math.sin(state.t*0.008)*0.035;
              const b=state.butterfly;
              b.vy += ((state.touchY-b.y)*0.008*b.agility)+state.wind;
              b.vy *= 0.94;
              b.y = Math.max(70,Math.min(470,b.y+b.vy));

              if(slowTimer>0) slowTimer--; else if(bonus==='Soleil') setBonus('Aucun');
              if(agileTimer>0) agileTimer--; else b.agility=1;
              if(shieldTimer>0) shieldTimer--; else b.shield=false;

              const speedMul=slowTimer>0?0.5:0.85;
              for(const o of state.obstacles){
                o.x -= o.speed*speedMul;
                if(o.x<-90){o.x=rand(980,1360);o.y=rand(120,430);}
                if(Math.abs(o.x-b.x)<38 && Math.abs(o.y-b.y)<44){if(b.shield){b.shield=false;shieldTimer=0;o.x=-120;} else state.gameOver=true;}
              }
              for(const bo of state.bonuses){
                bo.x -= 1.2;
                if(bo.x<-80){bo.x=rand(980,1360);bo.y=rand(110,440);bo.type=['Fleur','Soleil','Abeille'][(Math.random()*3)|0];}
                if(Math.abs(bo.x-b.x)<28 && Math.abs(bo.y-b.y)<34){applyBonus(bo.type);bo.x=-80;}
              }
              state.score++; setScore(Math.floor(state.score/12));
            }

            ctx.clearRect(0,0,960,540);
            drawMountains();
            drawGround();
            drawForestEdge('left');
            drawForestEdge('right');
            [...state.obstacles].sort((a,b)=>a.y-b.y).forEach(drawObstacle);
            state.bonuses.forEach(drawBonus);
            drawButterfly(state.butterfly);
            drawSpringFlowers();
            if(state.gameOver){ctx.fillStyle='#000a';ctx.fillRect(0,0,960,540);ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.fillText('Game Over',370,250);}
            raf=requestAnimationFrame(loop);
          };
          loop();

          return ()=>{cancelAnimationFrame(raf);window.removeEventListener('mousemove',mm);window.removeEventListener('touchstart',ts);window.removeEventListener('touchmove',ts);};
        }, []);

        return <>
          <div className="ui">Mode Cool • Score: {score} | Bonus: {bonus}</div>
          <canvas ref={canvasRef} width="960" height="540" />
        </>;
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<FlybotGame />);
    </script>
  </body>
</html>
